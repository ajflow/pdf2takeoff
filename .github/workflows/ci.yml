name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sample
      - run: npm run build
      - run: npm run cli -- info public/examples/sample-floor-plan.pdf
      - run: npm run cli -- scan public/examples/sample-floor-plan.pdf --page 1 --at 88.35,271.42
      - run: node scripts/mcp-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
